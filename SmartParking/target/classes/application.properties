# ============================================
# SmartParking Map - Application Properties
# ============================================

# --- Server ---
server.port=8080

# --- PostgreSQL + PostGIS ---
spring.datasource.url=jdbc:postgresql://localhost:5433/smartparking
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# --- Schema SQL (eseguito all'avvio) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- Jackson: serializza BigDecimal senza trailing zeros ---
spring.jackson.generator.write-bigdecimal-as-plain=true

# --- CORS (per sviluppo locale) ---
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
